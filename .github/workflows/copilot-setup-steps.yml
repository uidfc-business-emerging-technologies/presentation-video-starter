# Prepares GitHub Copilot's cloud environment before it starts working on a task:
# installs the packages and downloads the browser Remotion renders with, so Copilot
# can render still frames to check its work. You do not need to run or change this file.
# See https://docs.github.com/en/copilot/how-tos/use-copilot-agents/coding-agent/customize-the-agent-environment

name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job must be called copilot-setup-steps, or Copilot will not use it.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install packages
        run: npm ci
      - name: Download the browser Remotion renders with
        run: npx remotion browser ensure
